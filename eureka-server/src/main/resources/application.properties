spring.application.name=eureka-server



# =====================================================
# EUREKA SERVER CONFIGURATION
# =====================================================

# Default port number for Eureka Server is 8761.
# Eureka Dashboard can be accessed at:
# http://localhost:8761
server.port=8761


# =====================================================
# ACTUATOR ENDPOINT CONFIGURATION
# =====================================================

# Excludes all Spring Boot Actuator endpoints from web exposure.
# Actuator endpoints are used to monitor application health,
# metrics, environment information and application status.
#management.endpoints.web.exposure.exclude=*

# Note:- 
# If you want to expose all Actuator endpoints instead,
# use the following property:
 management.endpoints.web.exposure.include=*


# =====================================================
# EUREKA CLIENT CONFIGURATION (EUREKA SERVER)
# =====================================================

# Disables registration of Eureka Server with itself.
# In a standalone Eureka Server setup, self-registration
# is not required because this application acts as the
# central Service Registry.
eureka.client.register-with-eureka=false


# Prevents Eureka Server from fetching the service registry
# from another Eureka Server.
# This is commonly disabled in a standalone Eureka Server setup.
eureka.client.fetch-registry=false


# Eureka Server address
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Disable Eureka Server internal logs.
# Reduces unnecessary log messages generated by Netflix Eureka.
logging.level.com.netflix.eureka=OFF

# Disable Eureka Client and service discovery logs.
# Reduces registration, heartbeat, registry-fetching and discovery-related log messages.
logging.level.com.netflix.discovery=OFF